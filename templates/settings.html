<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Settings - Footage Offloader</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Top Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="/" class="btn-icon" title="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>
            <h1>Settings</h1>
        </div>
    </header>

    <main class="container settings-container">
        <!-- SMB Configuration -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/></svg>
                    <span>SMB / NAS Connection</span>
                </div>
            </div>
            <div class="settings-form">
                <div class="form-group">
                    <label>Server Address</label>
                    <input type="text" id="smb_host" class="text-input" placeholder="192.168.1.100 or nas.local">
                    <span class="form-hint">IP address or hostname of your NAS (Tailscale IP for remote)</span>
                </div>
                <div class="form-group">
                    <label>Share Name</label>
                    <input type="text" id="smb_share" class="text-input" placeholder="footage">
                    <span class="form-hint">The SMB share name on your NAS</span>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="smb_username" class="text-input" placeholder="admin" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="smb_password" class="text-input" placeholder="••••••••" autocomplete="current-password">
                </div>
                <div class="form-actions">
                    <button class="btn" onclick="testSMB()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        Test Connection
                    </button>
                    <span id="smb-test-result" class="test-result"></span>
                </div>
            </div>
        </section>

        <!-- Discord Integration -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
                    <span>Discord Notifications</span>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="discord_enabled">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="settings-form">
                <div class="form-group">
                    <label>Webhook URL</label>
                    <input type="text" id="discord_webhook_url" class="text-input" placeholder="https://discord.com/api/webhooks/...">
                    <span class="form-hint">Create a webhook in your Discord channel settings</span>
                </div>
                <div class="form-actions">
                    <button class="btn" onclick="testDiscord()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        Send Test
                    </button>
                    <span id="discord-test-result" class="test-result"></span>
                </div>
            </div>
        </section>

        <!-- Save -->
        <div class="settings-save">
            <button class="btn btn-primary btn-lg" onclick="saveSettings()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Save Settings
            </button>
        </div>
    </main>

    <script>
        // Load current settings
        async function loadSettings() {
            try {
                const r = await fetch('/api/config');
                const cfg = await r.json();
                document.getElementById('smb_host').value = cfg.smb_host || '';
                document.getElementById('smb_share').value = cfg.smb_share || '';
                document.getElementById('smb_username').value = cfg.smb_username || '';
                document.getElementById('smb_password').value = cfg.smb_password || '';
                document.getElementById('discord_webhook_url').value = cfg.discord_webhook_url || '';
                document.getElementById('discord_enabled').checked = cfg.discord_enabled || false;
            } catch (e) {
                console.error('Failed to load config:', e);
            }
        }

        async function saveSettings() {
            const data = {
                smb_host: document.getElementById('smb_host').value,
                smb_share: document.getElementById('smb_share').value,
                smb_username: document.getElementById('smb_username').value,
                smb_password: document.getElementById('smb_password').value,
                discord_webhook_url: document.getElementById('discord_webhook_url').value,
                discord_enabled: document.getElementById('discord_enabled').checked,
            };
            try {
                const r = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data),
                });
                const result = await r.json();
                if (result.status === 'ok') {
                    showToast('Settings saved');
                }
            } catch (e) {
                showToast('Failed to save', 'error');
            }
        }

        async function testSMB() {
            const el = document.getElementById('smb-test-result');
            el.textContent = 'Testing...';
            el.className = 'test-result';
            
            // Save first
            await saveSettings();
            
            try {
                const r = await fetch('/api/smb/test', {method: 'POST'});
                const result = await r.json();
                if (result.success) {
                    el.textContent = '✓ Connected';
                    el.className = 'test-result test-success';
                } else {
                    el.textContent = '✗ ' + (result.error || 'Failed');
                    el.className = 'test-result test-error';
                }
            } catch (e) {
                el.textContent = '✗ Network error';
                el.className = 'test-result test-error';
            }
        }

        async function testDiscord() {
            const el = document.getElementById('discord-test-result');
            el.textContent = 'Sending...';
            el.className = 'test-result';
            
            await saveSettings();
            
            try {
                const r = await fetch('/api/discord/test', { method: 'POST' });
                const result = await r.json();
                if (result.success) {
                    el.textContent = '✓ Notification sent!';
                    el.className = 'test-result test-success';
                } else {
                    el.textContent = '✗ ' + (result.error || 'Failed');
                    el.className = 'test-result test-error';
                }
            } catch (e) {
                el.textContent = '✗ Network error';
                el.className = 'test-result test-error';
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('toast-show'), 10);
            setTimeout(() => {
                toast.classList.remove('toast-show');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        loadSettings();
    </script>
</body>
</html>
