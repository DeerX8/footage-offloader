<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Footage Offloader</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
</head>
<body>
    <!-- Top Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <svg class="icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <h1>Footage Offloader</h1>
        </div>
        <div class="topbar-right">
            <span id="system-info" class="system-badge"></span>
            <a href="/settings" class="btn-icon" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            </a>
        </div>
    </header>

    <main class="container">
        <!-- SSD Status Card -->
        <section class="card" id="ssd-card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M3 9h2M3 15h2M19 9h2M19 15h2"/></svg>
                    <span>SSD Storage</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-sm" id="btn-mount-ssd" onclick="mountSSD()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        Mount
                    </button>
                    <button class="btn btn-sm btn-ghost" id="btn-unmount-ssd" onclick="unmountSSD()" style="display:none">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        Eject
                    </button>
                </div>
            </div>
            <div id="ssd-status" class="ssd-status">
                <div class="status-dot status-disconnected"></div>
                <span>Checking SSD...</span>
            </div>
            <div id="ssd-usage" class="usage-bar-container" style="display:none">
                <div class="usage-bar"><div class="usage-bar-fill" id="ssd-usage-fill"></div></div>
                <span class="usage-text" id="ssd-usage-text"></span>
            </div>
        </section>

        <!-- Destination Selector -->
        <section class="card" id="dest-card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                    <span>Destination</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-sm btn-ghost" onclick="refreshSubfolders()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-1.64-8.36L23 10"/></svg>
                    </button>
                </div>
            </div>
            <div class="dest-selector">
                <select id="subfolder-select" class="select-input" onchange="updateRemotePath()">
                    <option value="">Select project folder...</option>
                </select>
                <div class="remote-path" id="remote-path"></div>
                <div class="new-folder-row">
                    <input type="text" id="new-folder-name" class="text-input" placeholder="New folder name...">
                    <button class="btn btn-sm" onclick="createSubfolder()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Speed Test Card -->
        <section class="card card-compact" id="speedtest-card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    <span>Transfer Speed</span>
                </div>
                <button class="btn btn-sm" id="btn-speedtest" onclick="runSpeedTest()">
                    Run Test
                </button>
            </div>
            <div id="speedtest-result" class="speedtest-result" style="display:none">
                <span class="speed-value" id="speed-value">--</span>
                <span class="speed-unit">MB/s</span>
            </div>
        </section>

        <!-- File Browser -->
        <section class="card card-grow" id="files-card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span>Files</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-sm btn-ghost" id="btn-select-all" onclick="selectAll()">Select All</button>
                    <button class="btn btn-sm btn-ghost" id="btn-deselect-all" onclick="deselectAll()" style="display:none">Deselect All</button>
                </div>
            </div>

            <!-- Breadcrumb -->
            <div id="breadcrumb" class="breadcrumb">
                <span class="crumb crumb-active" onclick="navigateTo('')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-sm"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                    SSD
                </span>
            </div>

            <!-- File Type Filters -->
            <div id="filter-bar" class="filter-bar">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
                <button class="filter-btn" data-filter="video" onclick="setFilter('video')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Video
                </button>
                <button class="filter-btn" data-filter="photo" onclick="setFilter('photo')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    Photo
                </button>
                <button class="filter-btn" data-filter="audio" onclick="setFilter('audio')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    Sound
                </button>
            </div>

            <!-- File List -->
            <div id="file-list" class="file-list">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
                    <p>Mount an SSD to browse files</p>
                </div>
            </div>
        </section>

        <!-- Bottom Action Bar (when files selected) -->
        <div class="action-bar" id="action-bar" style="display:none">
            <div class="action-info">
                <span id="selected-count">0 files</span>
                <span class="action-sep">•</span>
                <span id="selected-size">0 B</span>
                <span class="action-sep eta-info" id="eta-display" style="display:none">•</span>
                <span class="eta-info" id="eta-value" style="display:none"></span>
            </div>
            <button class="btn btn-primary" id="btn-start-copy" onclick="confirmCopy()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                Copy
            </button>
        </div>

        <!-- Copy Progress Overlay -->
        <div class="progress-overlay" id="progress-overlay" style="display:none">
            <div class="progress-card">
                <div class="progress-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    <span>Copying...</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar"><div class="progress-bar-fill" id="copy-progress-fill"></div></div>
                    <span class="progress-pct" id="copy-progress-pct">0%</span>
                </div>
                <div class="progress-details">
                    <div class="progress-row">
                        <span class="progress-label">File</span>
                        <span class="progress-val" id="copy-current-file">--</span>
                    </div>
                    <div class="progress-row">
                        <span class="progress-label">Progress</span>
                        <span class="progress-val" id="copy-file-count">0 / 0</span>
                    </div>
                    <div class="progress-row">
                        <span class="progress-label">Copied</span>
                        <span class="progress-val" id="copy-bytes">0 B / 0 B</span>
                    </div>
                    <div class="progress-row">
                        <span class="progress-label">Speed</span>
                        <span class="progress-val" id="copy-speed">--</span>
                    </div>
                    <div class="progress-row">
                        <span class="progress-label">ETA</span>
                        <span class="progress-val" id="copy-eta">--</span>
                    </div>
                </div>
                <div class="progress-actions">
                    <button class="btn btn-danger" onclick="confirmCancel()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Completion Overlay -->
        <div class="progress-overlay" id="complete-overlay" style="display:none">
            <div class="progress-card">
                <div class="progress-header complete-header" id="complete-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    <span id="complete-title">Copy Complete</span>
                </div>
                <div class="progress-details" id="complete-details"></div>
                <div class="progress-actions">
                    <button class="btn btn-primary" onclick="dismissComplete()">OK</button>
                </div>
            </div>
        </div>

        <!-- Confirm Modal -->
        <div class="modal-overlay" id="modal-overlay" style="display:none">
            <div class="modal">
                <div class="modal-header" id="modal-title">Confirm</div>
                <div class="modal-body" id="modal-body">Are you sure?</div>
                <div class="modal-actions">
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" id="modal-confirm" onclick="">Confirm</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
